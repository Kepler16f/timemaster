[package]
name = "reunion"
version = "0.7.0"
description = "Reunion — 多人共享日程（桌面端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
# tray-icon：托盘入口；image-png：托盘图标用打包的 png
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# 系统通知（Windows 用 winrt，Linux 走 notify-rust），经自定义 command `notify` 暴露
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# rustls（默认）不依赖系统 OpenSSL：deb/AppImage 里不用捆绑 libssl，跨发行版稳
ureq = { version = "2.10", features = ["gzip"] }
uuid = { version = "1", features = ["v4"] }
# 下载的安装包按 GitHub 给的 sha256 校一遍再交给安装器（反代可能截断/换包）
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
