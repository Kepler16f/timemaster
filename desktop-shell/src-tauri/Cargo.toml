[package]
name = "reunion"
version = "0.4.0"
description = "Reunion — 多人共享日程（桌面端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
# rustls（默认）不依赖系统 OpenSSL：deb/AppImage 里不用捆绑 libssl，跨发行版稳
ureq = { version = "2.10", features = ["gzip"] }
uuid = { version = "1", features = ["v4"] }
# 下载的安装包按 GitHub 给的 sha256 校一遍再交给安装器（反代可能截断/换包）
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
strip = true
