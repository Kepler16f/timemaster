name: HarmonyOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'harmony-shell/**'
      - 'scripts/sync-harmony-web.mjs'
      - '.github/workflows/harmony.yml'

env:
  # 社区公开镜像（ErBWs/setup-ohos 自动从 ErBWs/ohos-sdk Releases 拉取，免登录、带 sha256 校验）
  CLT_VERSION: 5.0.13.200

jobs:
  hap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native deps (libGL for hvigor)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS command-line-tools (public mirror + checksum)
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.CLT_VERSION }}
          cache: true

      - name: Configure SDK env
        run: |
          echo "--- sdk-pkg.json ---"
          cat "$HOS_SDK_HOME/default/sdk-pkg.json" 2>/dev/null || find "$HOS_SDK_HOME" -maxdepth 2 -name sdk-pkg.json -exec cat {} +
          # hvigor 命令行构建要求 DEVECO_SDK_HOME 指向含 default/ 的 sdk 根
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"

      - name: Sync web assets into rawfile
        run: node scripts/sync-harmony-web.mjs

      - name: Dump SDK declarations (debug, remove after API fixes)
        run: |
          ETS=$(find "$HOS_SDK_HOME" -maxdepth 5 -type d -name ets | head -1)
          CM=$(find "$ETS" -name '@ohos.calendarManager.d.ts' | head -1)
          SK=$(find "$ETS" -name '@ohos.net.socket.d.ts' | head -1)
          echo "== calendarManager: $CM =="
          grep -nE "getAccount|getActiveAccount|getCalendar|createCalendar|getWritableCalendars|getReadableCalendars" "$CM" | head -30
          echo "-- EventType --"
          sed -n "$(grep -n 'enum EventType' "$CM" | head -1 | cut -d: -f1),+40p" "$CM"
          echo "-- interface Event --"
          sed -n "$(grep -n 'interface Event ' "$CM" | head -1 | cut -d: -f1),+60p" "$CM"
          echo "== socket: $SK =="
          grep -nE "constructTLSSocketInstance|declare class TLSSocket|interface TLSConnectOptions|interface TLSReceiveOptions|function connect|abstract connect|recv|send" "$SK" | head -40
          echo "-- TLSConnectOptions block --"
          sed -n "$(grep -n 'interface TLSConnectOptions' "$SK" | head -1 | cut -d: -f1),+25p" "$SK"
          echo "-- TLSSocket class head --"
          sed -n "$(grep -n 'declare class TLSSocket' "$SK" | head -1 | cut -d: -f1),+120p" "$SK" | grep -nE "connect|send|recv|read|close|^\s*[a-z]+\(" | head -30

      - name: Build HAP (hvigorw assembleHap, debug unsigned)
        working-directory: harmony-shell
        run: hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon

      - name: Sign HAP (hap-sign-tool, localSign)
        env:
          P12_B64: ${{ secrets.HAP_P12_B64 }}
          CER_B64: ${{ secrets.HAP_CERT_B64 }}
          P7B_B64: ${{ secrets.HAP_PROFILE_B64 }}
          P12_PWD: ${{ secrets.HAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAP_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.HAP_KEY_PASSWORD }}
        run: |
          HAP=harmony-shell/entry/build/default/outputs/default/entry-default-unsigned.hap
          if [ -z "$P12_B64" ]; then
            echo "::warning::未配置签名 Secrets，输出未签名 HAP（无法直接安装）"
            cp "$HAP" timemaster-unsigned.hap
          else
            mkdir -p signature
            echo "$P12_B64" | base64 -d > signature/release.p12
            echo "$CER_B64" | base64 -d > signature/release.cer
            echo "$P7B_B64" | base64 -d > signature/release.p7b
            TOOL=$(find "$HOME/ohos-sdk" -name 'hap-sign-tool.jar' | head -1)
            java -jar "$TOOL" sign-app -mode localSign \
              -inHap "$HAP" -outHap timemaster-signed.hap \
              -keystore signature/release.p12 -keyAlias "$KEY_ALIAS" \
              -keyPwd "$KEY_PWD" -kePwd "$P12_PWD" \
              -signAlg SHA256withECDSA \
              -appCertFile signature/release.cer -profileFile signature/release.p7b
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: timemaster.hap
          path: timemaster-*.hap
          archive: false
