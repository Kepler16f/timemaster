name: HarmonyOS CI

on:
  # 手动运行时可勾选 publish，才会发 GitHub Release；push 只构建产物
  workflow_dispatch:
    inputs:
      publish:
        description: 发布为 GitHub Release（不勾则只留 Actions 产物）
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'harmony-shell/**'
      - 'public/**'
      - 'scripts/sync-harmony-web.mjs'
      - '.github/workflows/harmony.yml'

env:
  # 社区公开镜像（ErBWs/setup-ohos 自动从 ErBWs/ohos-sdk Releases 拉取，免登录、带 sha256 校验）
  # READ/WRITE_WHOLE_CALENDAR 是 API 20 起开放的受限权限，整条流水线常驻用 API 20 SDK
  CLT_VERSION: 6.1.1.280

permissions:
  contents: write

jobs:
  hap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native deps (libGL for hvigor)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS command-line-tools (public mirror + checksum)
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.CLT_VERSION }}
          cache: true

      - name: Configure SDK env
        run: |
          echo "--- sdk-pkg.json ---"
          cat "$HOS_SDK_HOME/default/sdk-pkg.json" 2>/dev/null || find "$HOS_SDK_HOME" -maxdepth 2 -name sdk-pkg.json -exec cat {} +
          # hvigor 命令行构建要求 DEVECO_SDK_HOME 指向含 default/ 的 sdk 根
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"

      - name: Sync web assets into rawfile
        run: node scripts/sync-harmony-web.mjs

      - name: Build HAP (hvigorw assembleHap, debug unsigned)
        working-directory: harmony-shell
        run: hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon

      - name: 取出未签名 HAP
        run: |
          set -euo pipefail
          # 受限权限（READ/WRITE_WHOLE_CALENDAR）的授权载体是签名 profile，私钥不进仓库，
          # 所以 CI 只出未签名包；正式可装的包由 scripts/hap-sign-local.sh 在本机签好再传
          cp harmony-shell/entry/build/default/outputs/default/entry-default-unsigned.hap timemaster-unsigned.hap

      - uses: actions/upload-artifact@v7
        with:
          name: timemaster-unsigned.hap
          path: timemaster-*.hap
          archive: false

      - name: 发布到 GitHub Release（App 内更新从这里取包）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 发不发 Release 由人决定：push 触发的构建只留 Actions 产物，
          # 要发版就手动运行本工作流并把 publish 勾上
          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "publish 未勾选，只构建产物不发 Release"
            exit 0
          fi
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          # 主名 reunion-vX.hap 留给本机签好的包（scripts/hap-sign-local.sh 上传），
          # CI 这份没有 profile 的 ACL 授权、装不上受限权限，只作为 -unsigned 备用
          cp $(ls timemaster-*.hap | head -1) "reunion-v$VER-unsigned.hap"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          TAG_SHA=$(git ls-remote origin "refs/tags/v$VER" | awk '{print $1}')
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::v$VER 已发布于 $TAG_SHA，与当前提交不同 —— 跳过发布。请先提升 public/app.js 的 APP_VERSION。"
            exit 0
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1 || { git tag "v$VER"; git push origin "v$VER" || echo "标签已被另一条流水线创建，忽略"; }
          bash scripts/release-notes.sh "$VER" RELEASE_NOTES.md
          gh release create "v$VER" --title "Reunion v$VER" --notes-file RELEASE_NOTES.md 2>/dev/null || true
          gh release edit "v$VER" --title "Reunion v$VER" --notes-file RELEASE_NOTES.md
          gh release upload "v$VER" "reunion-v$VER-unsigned.hap" --clobber
