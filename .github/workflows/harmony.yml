name: HarmonyOS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'harmony-shell/**'
      - 'scripts/sync-harmony-web.mjs'
      - '.github/workflows/harmony.yml'

env:
  CLI_RELEASE_TAG: harmony-cli
  CLI_ASSET: command-line-tools-linux.zip

jobs:
  hap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch HarmonyOS Command Line Tools (private release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$CLI_RELEASE_TAG" -p "$CLI_ASSET" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && unzip -q "$CLI_ASSET"
          echo "$RUNNER_TEMP/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "OHOS_BASE_SDK_HOME=$RUNNER_TEMP/command-line-tools/sdk" >> "$GITHUB_ENV"

      - name: Sync web assets into rawfile
        run: node scripts/sync-harmony-web.mjs

      - name: ohpm install
        working-directory: harmony-shell
        run: ohpm install --all --registry https://ohpm.openharmony.cn/ohpm/

      - name: Build HAP (hvigor)
        working-directory: harmony-shell
        run: hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon

      - name: Sign HAP (hap-sign-tool, localSign)
        env:
          P12_B64: ${{ secrets.HAP_P12_B64 }}
          CER_B64: ${{ secrets.HAP_CERT_B64 }}
          P7B_B64: ${{ secrets.HAP_PROFILE_B64 }}
          P12_PWD: ${{ secrets.HAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAP_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.HAP_KEY_PASSWORD }}
        run: |
          HAP=harmony-shell/entry/build/default/outputs/default/entry-default-unsigned.hap
          if [ -z "$P12_B64" ]; then
            echo "::warning::未配置签名 Secrets，输出未签名 HAP（无法直接安装）"
            cp "$HAP" timemaster-unsigned.hap
          else
            mkdir -p signature
            echo "$P12_B64"   | base64 -d > signature/release.p12
            echo "$CER_B64"   | base64 -d > signature/release.cer
            echo "$P7B_B64"   | base64 -d > signature/release.p7b
            TOOL=$(find "$RUNNER_TEMP/command-line-tools" -name 'hap-sign-tool.jar' | head -1)
            java -jar "$TOOL" sign-app -mode localSign \
              -inHap "$HAP" -outHap timemaster-signed.hap \
              -keystore signature/release.p12 -keyAlias "$KEY_ALIAS" \
              -keyPwd "$KEY_PWD" -kePwd "$P12_PWD" \
              -signAlg SHA256withECDSA \
              -appCertFile signature/release.cer -profileFile signature/release.p7b
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: timemaster.hap
          path: timemaster-*.hap
          archive: false
