name: HarmonyOS CI

on:
  # 手动运行时可勾选 publish，才会发 GitHub Release；push 只构建产物
  workflow_dispatch:
    inputs:
      publish:
        description: 发布为 GitHub Release（不勾则只留 Actions 产物）
        type: boolean
        default: false
      whole_calendar:
        description: 实验构建：升 API 20 SDK 并声明 READ_WHOLE_CALENDAR（产物单独命名，绝不发版）
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'harmony-shell/**'
      - 'public/**'
      - 'scripts/sync-harmony-web.mjs'
      - '.github/workflows/harmony.yml'

env:
  # 社区公开镜像（ErBWs/setup-ohos 自动从 ErBWs/ohos-sdk Releases 拉取，免登录、带 sha256 校验）
  CLT_VERSION: ${{ github.event.inputs.whole_calendar == 'true' && '6.1.1.280' || '5.0.13.200' }}

permissions:
  contents: write

jobs:
  hap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native deps (libGL for hvigor)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev

      - name: Setup HarmonyOS command-line-tools (public mirror + checksum)
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.CLT_VERSION }}
          cache: true

      - name: Configure SDK env
        run: |
          echo "--- sdk-pkg.json ---"
          cat "$HOS_SDK_HOME/default/sdk-pkg.json" 2>/dev/null || find "$HOS_SDK_HOME" -maxdepth 2 -name sdk-pkg.json -exec cat {} +
          # hvigor 命令行构建要求 DEVECO_SDK_HOME 指向含 default/ 的 sdk 根
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "@ohos:registry=https://repo.harmonyos.com/npm/" >> "$HOME/.npmrc"

      - name: 实验分支：升到 API 20 并声明 READ_WHOLE_CALENDAR
        if: ${{ github.event.inputs.whole_calendar == 'true' }}
        run: |
          # READ_WHOLE_CALENDAR 是受限开放权限：API 20 起才对普通应用开放，且要求签名 profile 带 ACL。
          # 所以只在这条实验分支上临时改清单，产物另存一个名字，正式通道不受影响。
          python3 - <<'PY'
          import io
          nl = chr(10)
          bp = 'harmony-shell/build-profile.json5'
          s = io.open(bp, encoding='utf-8').read()
          s = s.replace('"compatibleSdkVersion": "5.0.0(12)"', '"compatibleSdkVersion": "6.0.0(20)"')
          io.open(bp, 'w', encoding='utf-8').write(s)
          for p in ('harmony-shell/hvigor/hvigor-config.json5', 'harmony-shell/oh-package.json5'):
              s = io.open(p, encoding='utf-8').read().replace('"modelVersion": "5.0.0"', '"modelVersion": "6.0.0"')
              io.open(p, 'w', encoding='utf-8').write(s)
          mj = 'harmony-shell/entry/src/main/module.json5'
          s = io.open(mj, encoding='utf-8').read()
          anchor = '"name": "ohos.permission.READ_CALENDAR"'
          extra = nl.join([
              '"name": "ohos.permission.READ_WHOLE_CALENDAR",',
              '"reason": "$string:calendar_reason",',
              '"usedScene": { "abilities": ["EntryAbility"], "when": "inuse" }',
              '      },',
              '      {',
              anchor,
          ])
          assert anchor in s, 'module.json5 里没找到 READ_CALENDAR 声明'
          s = s.replace(anchor, extra, 1)
          io.open(mj, 'w', encoding='utf-8').write(s)
          hc = 'harmony-shell/entry/src/main/ets/bridge/HarmonyCalendar.ets'
          s = io.open(hc, encoding='utf-8').read()
          assert 'const WHOLE_CAL = false;' in s, 'HarmonyCalendar.ets 里没找到 WHOLE_CAL 开关'
          s = s.replace('const WHOLE_CAL = false;', 'const WHOLE_CAL = true;')
          io.open(hc, 'w', encoding='utf-8').write(s)
          PY
          grep -n 'CALENDAR' harmony-shell/entry/src/main/module.json5
          grep -n 'compatibleSdkVersion' harmony-shell/build-profile.json5

      - name: Sync web assets into rawfile
        run: node scripts/sync-harmony-web.mjs

      - name: Build HAP (hvigorw assembleHap, debug unsigned)
        working-directory: harmony-shell
        run: hvigorw assembleHap -p product=default -p buildMode=debug --no-daemon

      - name: Sign HAP (hap-sign-tool, localSign)
        env:
          P12_B64: ${{ secrets.HAP_P12_B64 }}
          CER_B64: ${{ secrets.HAP_CERT_B64 }}
          P7B_B64: ${{ secrets.HAP_PROFILE_B64 }}
          P12_PWD: ${{ secrets.HAP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAP_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.HAP_KEY_PASSWORD }}
        run: |
          HAP=harmony-shell/entry/build/default/outputs/default/entry-default-unsigned.hap
          if [ -z "$P12_B64" ]; then
            echo "::warning::未配置签名 Secrets，输出未签名 HAP（无法直接安装）"
            cp "$HAP" timemaster-unsigned.hap
          else
            mkdir -p signature
            echo "$P12_B64" | base64 -d > signature/release.p12
            echo "$CER_B64" | base64 -d > signature/release.cer
            echo "$P7B_B64" | base64 -d > signature/release.p7b
            TOOL=$(find "$HOME/ohos-sdk" -name 'hap-sign-tool.jar' | head -1)
            java -jar "$TOOL" sign-app -mode localSign \
              -inHap "$HAP" -outHap timemaster-signed.hap \
              -keystore signature/release.p12 -keyAlias "$KEY_ALIAS" \
              -keyPwd "$KEY_PWD" -kePwd "$P12_PWD" \
              -signAlg SHA256withECDSA \
              -appCertFile signature/release.cer -profileFile signature/release.p7b
          fi

      - name: 实验产物改名（与正式通道区分）
        if: ${{ github.event.inputs.whole_calendar == 'true' }}
        run: for f in timemaster-*.hap; do mv "$f" "readwhole-$f"; done

      - uses: actions/upload-artifact@v7
        with:
          name: timemaster.hap
          path: timemaster-*.hap
          archive: false

      - name: 发布到 GitHub Release（App 内更新从这里取包）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 实验构建（声明了受限权限，profile 没带 ACL 时装不上）一律不进 Release
          if [ "${{ github.event.inputs.whole_calendar }}" = "true" ]; then
            echo "实验分支构建：只留产物，不发 Release"
            exit 0
          fi
          # 发不发 Release 由人决定：push 触发的构建只留 Actions 产物，
          # 要发版就手动运行本工作流并把 publish 勾上
          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "publish 未勾选，只构建产物不发 Release"
            exit 0
          fi
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          cp $(ls timemaster-*.hap | head -1) "reunion-v$VER.hap"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          TAG_SHA=$(git ls-remote origin "refs/tags/v$VER" | awk '{print $1}')
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::v$VER 已发布于 $TAG_SHA，与当前提交不同 —— 跳过发布。请先提升 public/app.js 的 APP_VERSION。"
            exit 0
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1 || { git tag "v$VER"; git push origin "v$VER" || echo "标签已被另一条流水线创建，忽略"; }
          bash scripts/release-notes.sh "$VER" RELEASE_NOTES.md
          gh release create "v$VER" --title "Reunion v$VER" --notes-file RELEASE_NOTES.md 2>/dev/null || true
          gh release edit "v$VER" --title "Reunion v$VER" --notes-file RELEASE_NOTES.md
          gh release upload "v$VER" "reunion-v$VER.hap" --clobber
