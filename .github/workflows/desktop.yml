name: Desktop CI

on:
  # 手动运行并勾 publish，才会把桌面包追加到已有的 v版本号 Release；push 只出产物
  workflow_dispatch:
    inputs:
      publish:
        description: 追加到已存在的 GitHub Release（不勾则只留 Actions 产物）
        type: boolean
        default: false
  push:
    branches: [PC]
    paths:
      - 'desktop-shell/**'
      - 'public/**'
      - 'scripts/sync-desktop-web.mjs'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

env:
  # Tauri/Linux 的编译期依赖：webkit2gtk-4.1 是硬性要求（AppImage 里已含运行时，用户机不需要）
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
    libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64
          # 同一台 x64 runner 交叉出 arm64：Windows arm64 装机量小，不值得排 ARM runner
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: win-arm64
          # x64 用 22.04（glibc 2.35）而不是最新的，免得老 Ubuntu/Debian 装上就跑不起来
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri
          key: ${{ matrix.label }}

      - name: Install tauri CLI
        working-directory: desktop-shell
        run: npm install --no-audit --no-fund

      - name: 同步前端资源 + 盖版本号
        run: node scripts/sync-desktop-web.mjs

      - name: Build
        working-directory: desktop-shell
        run: npx tauri build --target ${{ matrix.target }}

      - name: 收集安装包
        shell: bash
        run: |
          set -euo pipefail
          # 统一改名成 reunion-<版本>-<目标>.<后缀>：Tauri 默认包名各平台不一样
          # （Release 上一堆长名字看不出谁是谁），应用内「打开发布页」也按这个命名挑对得上自己系统的那条
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          mkdir -p dist
          find "desktop-shell/src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) | while read -r f; do
              ext="${f##*.}"
              cp -v "$f" "dist/reunion-$VER-${{ matrix.label }}.$ext"
            done
          ls -l dist
          test -n "$(ls -A dist)" || { echo "没收到任何安装包，检查 tauri.conf.json 的 bundle 配置"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: reunion-desktop-${{ matrix.label }}
          path: dist/*
          archive: false

      - name: 追加到已有 Release（绝不新建）
        if: inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 发版时机由 App/鸿蒙那条流水线决定（它负责打标签和写更新说明）；
          # 这里只把桌面包挂到同一个 tag 上，Release 不存在就什么都不做
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            echo "v$VER 还没有 Release，跳过追加"
            exit 0
          fi
          gh release upload "v$VER" dist/* --clobber
