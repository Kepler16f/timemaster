name: Desktop CI

on:
  # 单独重跑桌面构建用；发 Release 一律走 release.yml（它调用本文件并把四个包一起挂上）
  workflow_dispatch:
  # 供 release.yml 调用
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'desktop-shell/**'
      - 'public/**'
      - 'scripts/sync-desktop-web.mjs'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

env:
  # Tauri/Linux 的编译期依赖：webkit2gtk-4.1 是硬性要求（deb 不捆绑运行时，用户机自己装）
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
    libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ext 与 label 一起写进制品名，release.yml 直接拿制品名当 Release 上的文件名，
          # 不必在下载之后再猜谁的扩展名是 exe、谁是 deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64
            ext: exe
          # 同一台 x64 runner 交叉出 arm64：Windows arm64 装机量小，不值得排 ARM runner
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: win-arm64
            ext: exe
          # x64 用 22.04（glibc 2.35）而不是最新的，免得老 Ubuntu/Debian 装上就跑不起来
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            ext: deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            ext: deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri
          key: ${{ matrix.label }}

      - name: Install tauri CLI
        working-directory: desktop-shell
        run: npm install --no-audit --no-fund

      - name: 同步前端资源 + 盖版本号
        run: node scripts/sync-desktop-web.mjs

      - name: Build
        working-directory: desktop-shell
        run: npx tauri build --target ${{ matrix.target }}

      - name: 收集安装包
        shell: bash
        run: |
          set -euo pipefail
          # 统一改名成 reunion-<版本>-<目标>.<后缀>：Tauri 默认包名各平台不一样
          # （Release 上一堆长名字看不出谁是谁），应用内「打开发布页」也按这个命名挑对得上自己系统的那条
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          # 交给下一步当制品名：release.yml 下载下来直接就是 Release 上该用的文件名
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          find "desktop-shell/src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.deb' \) | while read -r f; do
              ext="${f##*.}"
              cp -v "$f" "dist/reunion-$VER-${{ matrix.label }}.$ext"
            done
          ls -l dist
          test -n "$(ls -A dist)" || { echo "没收到任何安装包，检查 tauri.conf.json 的 bundle 配置"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: reunion-${{ env.VER }}-${{ matrix.label }}.${{ matrix.ext }}
          # 每个 target 只产一个安装包，archive:false 让制品就是原始文件本身——
          # 免下载后再解一层 zip（Linux 以前带 AppImage 时有两个文件才会报错，现在只出 deb）
          path: dist/*
          archive: false
