name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Sync Capacitor (public/ -> android-shell assets)
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android-shell
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: 发布到 GitHub Release（App 内更新从这里取包）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(sed -n "s/^const APP_VERSION *= *'\([0-9.]*\)'.*/\1/p" public/app.js | head -1)
          test -n "$VER" || { echo "解析 APP_VERSION 失败"; exit 1; }
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk "reunion-v$VER.apk"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1 || { git tag "v$VER"; git push origin "v$VER" || echo "标签已被另一条流水线创建，忽略"; }
          gh release create "v$VER" --title "Reunion v$VER" --notes "CI 自动构建 · 更新内容见本版本提交记录" 2>/dev/null || true
          gh release upload "v$VER" "reunion-v$VER.apk" --clobber

  release-apk:
    name: Build signed release APK (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
      - name: Assemble release APK
        working-directory: android-shell
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          archive: false
