name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改了鸿蒙那边就不必重跑安卓构建。标签也吃这个过滤，
    # 但发版标签必定指向改过 public/app.js 版本号的提交，所以不会被筛掉。
    paths:
      - 'public/**'
      - 'android-shell/**'
      - 'package*.json'
      - 'capacitor.config.*'
      - '.github/workflows/android.yml'
  # 单独重跑安卓构建用；发 Release 一律走 release.yml（一条流水线出全部六个安装包）
  workflow_dispatch:
  # 供 release.yml 调用。被调用时 inputs 全空，与本文件作为「只出产物」的定位一致
  workflow_call:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Sync Capacitor (public/ -> android-shell assets)
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android-shell
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          archive: false

  release-apk:
    name: Build signed release APK (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore
      - name: Assemble release APK
        working-directory: android-shell
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          archive: false
